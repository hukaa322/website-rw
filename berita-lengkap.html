<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Pengumuman & Berita - Vireta 2</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style-landing.css">

    <style>
        body {
            background-color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0F172A;
        }

        .archive-container {
            max-width: 1100px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .archive-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .archive-header h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
        }

        .archive-header p {
            color: #64748B;
            font-size: 16px;
        }

        /* Filter & Search Bar Section */
        .filter-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: #FFFFFF;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 32px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border-radius: 8px;
            border: 1px solid #CBD5E1;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: #00468B;
        }

        .category-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #E2E8F0;
            background: #F1F5F9;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #00468B;
            color: #FFFFFF;
            border-color: #00468B;
        }

        /* Grid Berita */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .news-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .news-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #F1F5F9;
        }

        .news-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .news-category {
            align-self: flex-start;
            background: #E0F2FE;
            color: #0369A1;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: #0F172A;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-date {
            font-size: 13px;
            color: #64748B;
            margin-bottom: 16px;
        }

        .news-readmore {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #00468B;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .news-readmore:hover {
            color: #002d5a;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            color: #475569;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-back-home:hover {
            background: #F1F5F9;
        }
    </style>
</head>
<body>

    <div class="archive-container">
        <!-- Tombol Kembali -->
        <a href="index.html#berita" class="btn-back-home">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
        </a>

        <!-- Header -->
        <div class="archive-header">
            <h1>Arsip Pengumuman & Berita</h1>
            <p>Daftar lengkap informasi dan kabar kegiatan seputar RW 05 Vireta 2</p>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-wrapper">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari judul berita atau pengumuman...">
            </div>

            <div class="category-filter" id="categoryFilter">
                <button class="filter-btn active" data-category="ALL">Semua</button>
                <button class="filter-btn" data-category="Kegiatan">Kegiatan</button>
                <button class="filter-btn" data-category="Pengumuman">Pengumuman</button>
                <button class="filter-btn" data-category="Berita Utama">Berita Utama</button>
                <button class="filter-btn" data-category="Lainnya">Lainnya</button>
            </div>
        </div>

        <!-- Wadah Grid Berita -->
        <div id="allNewsGrid" class="news-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #64748B;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 12px; font-weight: 600;">Memuat seluruh arsip berita...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/berita-lengkap.js"></script>
</body>
</html>
