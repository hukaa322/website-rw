<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Warga - Vireta 2</title>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/style-landing.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <main>
        <section id="layanan" class="section-padding">
            <div class="container">
                <div class="section-header text-center margin-bottom-30">
                    <h2 class="section-title">Layanan Warga</h2>
                    <p class="section-subtitle">"Pelayanan Administrasi, Iuran, Kesehatan & Keamanan Warga Vireta 2"</p>
                </div>

                <div class="gallery-page-header text-center margin-bottom-30">
                    <div class="gallery-pill-filter">
                        <button class="pill-btn layanan-tab-btn active" data-category="semua">
                            <i class="fa-solid fa-border-all"></i> Semua
                        </button>
                        <button class="pill-btn layanan-tab-btn" data-category="administrasi">
                            <i class="fa-solid fa-file-signature"></i> Surat Administrasi
                        </button>
                        <button class="pill-btn layanan-tab-btn" data-category="iuran">
                            <i class="fa-solid fa-receipt"></i> Pembayaran Iuran
                        </button>
                        <button class="pill-btn layanan-tab-btn" data-category="kesehatan">
                            <i class="fa-solid fa-heart-pulse"></i> Kesehatan
                        </button>
                        <button class="pill-btn layanan-tab-btn" data-category="keamanan">
                            <i class="fa-solid fa-shield-halved"></i> Keamanan
                        </button>
                    </div>
                </div>

                <div id="layananGrid" class="layanan-grid">
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748B;">
                        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                        <p style="margin-top: 10px; font-weight: 600;">Memuat layanan warga...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- JS -->
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/darkmode.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/layanan.js"></script>
    <script src="../js/layanan-landing.js"></script>

</body>

</html>
