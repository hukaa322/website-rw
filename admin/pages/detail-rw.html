<div class="crud-card">
    <div class="crud-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3><i class="fa-solid fa-sitemap"></i> Kelola Profil & Histori RW 05</h3>
        <button class="btn btn-primary btn-sm" onclick="window.openRwModal()">
            <i class="fa-solid fa-plus"></i> Tambah Data RW
        </button>
    </div>

    <!-- Tabel Monitoring Data RW -->
    <table class="admin-table" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>Periode</th>
                <th>Foto</th>
                <th>Nama Ketua RW</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="rwTableBody">
            <!-- Render via JS loadRwData() -->
        </tbody>
    </table>
</div>

<!-- Modal Form CRUD RW -->
<div id="rwModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px;">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h4 style="margin: 0;">Form Data RW</h4>
            <button class="close-btn" onclick="window.closeRwModal()" style="border: none; background: none; font-size: 20px; cursor: pointer;">&times;</button>
        </div>

        <form id="rwForm" enctype="multipart/form-data" onsubmit="window.saveRwData(event)">
            <input type="hidden" id="rwId" name="id">

            <div class="form-group" style="margin-bottom: 12px;">
                <label>Nama Ketua RW</label>
                <input type="text" id="nama_ketua" name="nama_ketua" placeholder="Contoh: Bpk. H. Supriyadi" required style="width: 100%; padding: 8px;">
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label>Periode Jabatan</label>
                <input type="text" id="periode" name="periode" placeholder="Contoh: 2023 - 2026" required style="width: 100%; padding: 8px;">
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label>Nomor Telepon / WA</label>
                <input type="text" id="nomor_telepon" name="nomor_telepon" placeholder="08xxxxxxxxxx" style="width: 100%; padding: 8px;">
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label>Status Kepengurusan</label>
                <select id="is_aktif" name="is_aktif" style="width: 100%; padding: 8px;">
                    <option value="1">Aktif (Saat Ini)</option>
                    <option value="0">Alumni / Histori Masa Lalu</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label>Deskripsi Visi & Misi / Catatan</label>
                <textarea id="visi_misi" name="visi_misi" rows="3" style="width: 100%; padding: 8px;"></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label>Foto Ketua / Dokumentasi (.SVG / Image)</label>
                <input type="file" id="foto_utama" name="foto_utama" accept="image/*" style="width: 100%;">
            </div>

            <div style="text-align: right; margin-top: 15px;">
                <button type="button" class="btn btn-secondary" onclick="window.closeRwModal()">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Data</button>
            </div>
        </form>
    </div>
</div>
